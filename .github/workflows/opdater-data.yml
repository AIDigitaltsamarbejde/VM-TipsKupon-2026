name: Opdater data.json

on:
  workflow_dispatch:

jobs:
  hent-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Installer Python dependencies
        run: pip install requests imapclient

      - name: Hent og merge data
        run: |
          python3 << 'PYEOF'
          import imapclient
          import email
          import json
          import os
          import re
          import requests
          import datetime

          # ── 1. Hent spillerdata + røde kort fra Gmail (Excel) ──────
          client = imapclient.IMAPClient('imap.gmail.com', ssl=True)
          client.login(os.environ['GMAIL_ADDRESS'], os.environ['GMAIL_APP_PASSWORD'])
          client.select_folder('INBOX')

          messages = client.search(['SUBJECT', 'VM2026 data'])
          if not messages:
              print("Ingen emails fundet")
              exit(1)

          latest = messages[-1]
          raw = client.fetch([latest], ['RFC822'])
          msg = email.message_from_bytes(raw[latest][b'RFC822'])

          body = ''
          for part in msg.walk():
              if part.get_content_type() == 'text/plain':
                  body = part.get_payload(decode=True).decode('utf-8', errors='ignore')
                  break

          match = re.search(r'(\{.*\})', body, re.DOTALL)
          if not match:
              print("Ingen JSON i email")
              exit(1)

          excel_data = json.loads(match.group(1))

          for key in ['spillere', 'kampe', 'vmVindere']:
              if key in excel_data:
                  cleaned = []
                  for item in excel_data[key]:
                      cleaned.append({k: v for k, v in item.items()
                                      if not k.startswith('@') and k != 'ItemInternalId'})
                  excel_data[key] = cleaned

          vm_vindere = [item.get('Lande', item.get('land', ''))
                        for item in excel_data.get('vmVindere', [])]

          spillere = excel_data.get('spillere', [])
          for s in spillere:
              if s.get('Initialer', s.get('initialer', '')) == 'BCO':
                  s['Navn'] = 'SnazzyFlex'
                  s['navn'] = 'SnazzyFlex'

          # Summer røde kort fra Excel-kampene
          roede_kort_excel = 0
          for k in excel_data.get('kampe', []):
              raw_val = k.get('RødeKort', k.get('RoedeKort', k.get('roedeKort', 0)))
              try:
                  roede_kort_excel += int(raw_val) if raw_val not in ('', None) else 0
              except (ValueError, TypeError):
                  pass

          # ── 2. Hent kampresultater fra football-data.org ───────────
          headers = {'X-Auth-Token': os.environ['FOOTBALL_API_TOKEN']}

          r = requests.get(
              'https://api.football-data.org/v4/competitions/WC/matches',
              headers=headers
          )

          total_maal = 0
          kampe = []

          if r.status_code == 200:
              matches = r.json().get('matches', [])
              print(f"Hentet {len(matches)} kampe fra football-data.org")

              for m in matches:
                  hjemme = m['homeTeam']['name']
                  ude    = m['awayTeam']['name']
                  status = m['status']
                  stage  = m.get('stage', '')

                  resultat = ''
                  resultatET = None
                  resultatPen = None
                  maal = 0

                  if status == 'FINISHED':
                      hg = m['score']['fullTime']['home'] or 0
                      ag = m['score']['fullTime']['away'] or 0
                      resultat = f'{hg}-{ag}'
                      maal = hg + ag
                      total_maal += maal

                      # Forlænget spilletid
                      et = m.get('score', {}).get('extraTime', {})
                      et_h = et.get('home')
                      et_a = et.get('away')
                      if et_h is not None and et_a is not None:
                          resultatET = f'{et_h}-{et_a}'

                      # Straffesparkskonkurrence (kun til visning — mål allerede inkluderet i fullTime)
                      penalties = m.get('score', {}).get('penalties', {})
                      pen_h = penalties.get('home')
                      pen_a = penalties.get('away')
                      if pen_h is not None and pen_a is not None:
                          resultatPen = f'{pen_h}-{pen_a}'

                  kampe.append({
                      'kamp': f'{hjemme} – {ude}',
                      'resultat': resultat,
                      'resultatET': resultatET,
                      'resultatPen': resultatPen,
                      'maal': maal,
                      'stage': stage,
                  })

              print(f"Total maal (inkl. straffespark): {total_maal}")
          else:
              print(f"API fejl: {r.status_code} - {r.text[:200]}")
              kampe = excel_data.get('kampe', [])

          print(f"Roede kort fra Excel: {roede_kort_excel}")

          # ── 3. Sammensæt og gem data.json ──────────────────────────
          data = {
              'opdateret': datetime.date.today().strftime('%d. %B %Y'),
              'totalKampe': 104,
              'totalMaal': total_maal,
              'roedeKort': roede_kort_excel,
              'spillere': spillere,
              'kampe': kampe,
              'vmVindere': vm_vindere,
          }

          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(f"data.json skrevet! {len(kampe)} kampe, {total_maal} maal, {roede_kort_excel} roede kort")
          PYEOF
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}

      - name: Commit og push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Opdater data.json"
          git push
