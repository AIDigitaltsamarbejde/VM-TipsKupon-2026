name: Find VM 2026 ID

on:
  workflow_dispatch:

jobs:
  hent-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Installer Python dependencies
        run: pip install requests imapclient

      - name: Find VM 2026 ID
        run: |
          python3 << 'PYEOF'
          import requests
          import os

          headers = {
              'x-apisports-key': os.environ['API_FOOTBALL_TOKEN']
          }

          # Tjek account status og hvilke leagues der er tilgængelige
          r = requests.get('https://v3.football.api-sports.io/status', headers=headers)
          print("Account status:", r.json())

          # Søg specifikt efter World Cup
          r2 = requests.get('https://v3.football.api-sports.io/leagues?id=1', headers=headers)
          print("League ID 1:", r2.json())

          r3 = requests.get('https://v3.football.api-sports.io/leagues?search=world+cup', headers=headers)
          data = r3.json()
          print(f"World Cup søgning - antal: {data.get('results', 0)}")
          for league in data.get('response', []):
              l = league.get('league', {})
              print(f"ID: {l.get('id')} | Navn: {l.get('name')}")
          PYEOF
        env:
          API_FOOTBALL_TOKEN: ${{ secrets.API_FOOTBALL_TOKEN }}

      - name: Commit og push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Opdater data.json"
          git push
