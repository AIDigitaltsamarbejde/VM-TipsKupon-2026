name: Opdater data.json fra Gmail

on:
  schedule:
    - cron: '*/10 * * * *'  # Kører hvert 10. minut
  workflow_dispatch:  # Kan også køres manuelt

jobs:
  hent-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Installer Python dependencies
        run: pip install imapclient

      - name: Hent data fra Gmail
        run: |
          python3 << 'EOF'
          import imapclient
          import email
          import json
          import os

          client = imapclient.IMAPClient('imap.gmail.com', ssl=True)
          client.login(os.environ['GMAIL_ADDRESS'], os.environ['GMAIL_APP_PASSWORD'])
          client.select_folder('INBOX')

          messages = client.search(['SUBJECT', 'VM2026 data'])
          if not messages:
              print("Ingen emails fundet - skriver ikke fil")
              exit(0)

          latest = messages[-1]
          raw = client.fetch([latest], ['RFC822'])
          msg = email.message_from_bytes(raw[latest][b'RFC822'])

          body = ''
          for part in msg.walk():
              if part.get_content_type() == 'text/plain':
                  body = part.get_payload(decode=True).decode('utf-8', errors='ignore')
                  break
          if not body:
              body = msg.get_payload(decode=True).decode('utf-8', errors='ignore')

          body = body.strip()
          print("Email body:", body[:200])

          try:
              json.loads(body)
              with open('data.json', 'w', encoding='utf-8') as f:
                  f.write(body)
              print("data.json skrevet!")
          except json.JSONDecodeError as e:
              print("Ugyldig JSON:", e)
              print("Fuld body:", body)
              exit(1)
          EOF
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Commit og push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Opdater data.json"
          git push
