name: Opdater data.json fra Gmail

on:
  schedule:
    - cron: '*/10 * * * *'  # Kører hvert 10. minut
  workflow_dispatch:  # Kan også køres manuelt

jobs:
  hent-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Installer Python dependencies
        run: pip install imapclient

      - name: Hent data fra Gmail
        run: |
          python3 << 'EOF'
          import imapclient
          import email
          import json
          import os
          import re

          client = imapclient.IMAPClient('imap.gmail.com', ssl=True)
          client.login(os.environ['GMAIL_ADDRESS'], os.environ['GMAIL_APP_PASSWORD'])
          client.select_folder('INBOX')

          messages = client.search(['SUBJECT', 'VM2026 data'])
          if not messages:
              print("Ingen emails fundet")
              exit(0)

          latest = messages[-1]
          raw = client.fetch([latest], ['RFC822'])
          msg = email.message_from_bytes(raw[latest][b'RFC822'])

          body = ''
          for part in msg.walk():
              if part.get_content_type() == 'text/plain':
                  body = part.get_payload(decode=True).decode('utf-8', errors='ignore')
                  break
          if not body:
              body = msg.get_payload(decode=True).decode('utf-8', errors='ignore')

          # Udtræk kun JSON-delen (fra { til sidste })
          match = re.search(r'(\{.*\})', body, re.DOTALL)
          if not match:
              print("Ingen JSON fundet i email")
              exit(1)

          data = json.loads(match.group(1))

          # Rens @odata felter fra spillere, kampe og vmVindere
          for key in ['spillere', 'kampe', 'vmVindere']:
              if key in data:
                  cleaned = []
                  for item in data[key]:
                      cleaned.append({k: v for k, v in item.items() 
                                      if not k.startswith('@') and k != 'ItemInternalId'})
                  data[key] = cleaned

          # Tilpas vmVindere til at bruge 'land' i stedet for 'Lande'
          if 'vmVindere' in data:
              data['vmVindere'] = [item.get('Lande', item.get('land', '')) 
                                   for item in data['vmVindere']]

          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print("data.json skrevet!")
          EOF
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Commit og push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Opdater data.json"
          git push
